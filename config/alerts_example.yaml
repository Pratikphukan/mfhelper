# config/alerts_example.yaml
# Example template for Technical Indicator Alerts Settings
# Copy this file to config/alerts.yaml and configure your active settings.

rules:
  # 3-Tier RSI Buy Signals
  rsi_mild_pullback: 55.0      # Tier 1 buy zone (small top-up)
  rsi_moderate_dip: 45.0       # Tier 2 buy zone (moderate lumpsum)
  rsi_deep_oversold: 35.0      # Tier 3 buy zone (aggressive lumpsum)
  rsi_overbought: 70.0         # Momentum warning / trim zone

  # 3-Tier 200D SMA Buy Signals
  sma_trend_support_pct: 2.0        # Tier 1 buy zone (support distance from +2% to -2%)
  sma_moderate_discount_pct: -2.0    # Tier 2 buy zone (discount distance from -2% to -10%)
  sma_deep_capitulation_pct: -10.0   # Tier 3 buy zone (capitulation distance <= -10%)

  # 3-Tier 52W Peak Discount Pyramiding Buy Signals
  discount_mild_pct: -5.0           # Tier 1 buy zone (mild drop from peak -5% to -10%)
  discount_moderate_pct: -10.0       # Tier 2 buy zone (moderate drop from peak -10% to -20%)
  discount_deep_pct: -20.0           # Tier 3 buy zone (deep drop from peak <= -20%)

  enable_sma_crossing: true          # Send alerts on Bullish / Bearish trend crossings

email:
  enable: false                      # Set to true to enable active SMTP email alerts
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true
  sender_email: "your_email@gmail.com"
  sender_password: ""                # Leave blank to load from EMAIL_PASSWORD environment variable
  receiver_email: "receiver_email@gmail.com"

# Market regime and valuation context (optional, OFF by default).
# When enabled, buy alerts are gated by the broad market (NIFTY 500 + India VIX) and sized
# by the Nifty 50 P/E. Sell / trim alerts are never suppressed. Run `python regime_main.py`
# to see what the daily run would use today.
regime:
  enable: false

  classification:                    # first match wins: BEAR, CORRECTION, UPTREND, else NEUTRAL
    vix_low: 15.0                    # UPTREND: smoothed VIX below this and index above its 50D SMA
    vix_high: 18.0                   # CORRECTION: smoothed VIX at or above this (no upper cap)
    vix_smoothing_days: 5            # VIX is averaged over this many sessions
    confirm_days: 3                  # a new regime applies only after holding this many sessions
    short_sma_days: 50
    long_sma_days: 200               # BEAR: index below it and it is lower than slope_lookback_days ago
    slope_lookback_days: 20
    max_data_age_days: 5             # older market data is ignored (regime falls back to NEUTRAL)

  capitulation:                      # BEAR only: the sole buys allowed (both conditions required)
    rsi: 25.0
    sma_discount_pct: -12.0

  valuation:
    pe_stretched: 24.0               # above this: trim alerts fire earlier, buy size x stretched_factor
    pe_cheap: 18.0                   # below this: buy size x cheap_factor
    stale_days: 7
    # Used only when NSE cannot be reached. Update it from NSE (or any P/E source) if needed.
    # nifty50_pe: 22.4
    # nifty50_pe_as_of: "2026-11-06"

  multipliers:                       # suggested size as a multiple of your normal SIP / top-up
    tier1: 1.0
    tier2: 1.5
    tier3: 2.0
    uptrend_tier1: 1.5
    cheap_factor: 1.25
    stretched_factor: 0.5

  trimming:                          # applied while P/E is stretched
    rsi_offset: 5.0                  # RSI trim thresholds drop by this many points
    dist_52w_offset_pts: 2.0         # 52-week windows widen by this many points
