name: Daily NAV & Technical Alerts Scheduler

on:
  schedule:
    # 5:00 AM UTC translates precisely to 10:30 AM IST.
    # Runs Tuesday through Saturday because AMFI publishes business-day (Mon-Fri) NAVs late evening.
    - cron: '0 5 * * TUE-SAT'
  workflow_dispatch: # Allows triggering the run manually from the GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    # Template copies don't run until the user has completed setup.
    if: vars.MFHELPER_SETUP_COMPLETE == 'true'

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Restore Daily NAV State Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          data/last_nav.json
          data/sheet_columns.json
          data/combined_portfolio_allocation.json
          data/mfapi_cache/
          data/benchmark_history/
          data/market_context/
        key: daily-nav-state-${{ github.run_id }}-${{ github.run_number }}
        restore-keys: |
          daily-nav-state-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Reconstruct Secure Config Files
      env:
        GCP_CRED_BASE64: ${{ secrets.GCP_CREDENTIALS_JSON }}
        GCP_TOKEN_BASE64: ${{ secrets.GCP_TOKEN_JSON }}
        ALERTS_YAML_BASE64: ${{ secrets.ALERTS_YAML }}
        FUNDS_YAML: ${{ secrets.MFHELPER_FUNDS_YAML }}
        SETTINGS_YAML: ${{ secrets.MFHELPER_SETTINGS_YAML }}
        BENCHMARKS_YAML: ${{ secrets.MFHELPER_BENCHMARKS_YAML }}
      run: |
        mkdir -p config data
        echo "$GCP_CRED_BASE64" | base64 -d > config/credentials.json
        echo "$GCP_TOKEN_BASE64" | base64 -d > data/token.json
        echo "$ALERTS_YAML_BASE64" | base64 -d > config/alerts.yaml
        if [ -n "$FUNDS_YAML" ]; then printf '%s' "$FUNDS_YAML" > config/funds.yaml; fi
        if [ -n "$SETTINGS_YAML" ]; then printf '%s' "$SETTINGS_YAML" > config/settings.yaml; fi
        if [ -n "$BENCHMARKS_YAML" ]; then printf '%s' "$BENCHMARKS_YAML" > config/benchmarks.yaml; fi

        # Mask sensitive values extracted from secrets to avoid leaking into public workflow logs
        if [ -n "$SETTINGS_YAML" ]; then
          python3 -c "
        import yaml
        raw = yaml.safe_load('''$SETTINGS_YAML''') or {}
        sid = raw.get('google_sheet', {}).get('spreadsheet_id', '')
        if sid and sid != 'PASTE_SHEET_ID_HERE':
            print(f'::add-mask::{sid}')
        " 2>/dev/null || true
        fi

        if [ -n "$FUNDS_YAML" ]; then
          python3 -c "
        import yaml
        raw = yaml.safe_load('''$FUNDS_YAML''') or {}
        entries = raw.get('funds', []) or raw.get('etfs', [])
        for f in entries:
            code = str(f.get('code', '')).strip()
            name = str(f.get('name', '')).strip()
            if code and code != 'REPLACE_WITH_AMFI_SCHEME_CODE':
                print(f'::add-mask::{code}')
            if name and name != 'Example fund':
                print(f'::add-mask::{name}')
        " 2>/dev/null || true
        fi

    - name: Run Daily NAV Tracker
      env:
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        python main.py

    - name: Run Performance Returns Analyzer
      run: |
        # Suppress terminal summary tables in public runner logs; errors still print to stderr
        python returns_main.py > /dev/null

    - name: Run Consolidated Portfolio Map
      run: |
        # Suppress detailed holdings and weights in public runner logs; errors still print to stderr
        python portfolio_map_main.py > /dev/null

    - name: Compile Web Dashboard
      run: |
        python dashboard_main.py

    - name: Clean Up Sensitive Config Files
      if: always()
      run: |
        rm -f config/credentials.json data/token.json config/alerts.yaml
        rm -f config/funds.yaml config/settings.yaml config/benchmarks.yaml

    - name: Save Daily NAV State Cache
      uses: actions/cache/save@v4
      with:
        path: |
          data/last_nav.json
          data/sheet_columns.json
          data/combined_portfolio_allocation.json
          data/mfapi_cache/
          data/benchmark_history/
          data/market_context/
        key: daily-nav-state-${{ github.run_id }}-${{ github.run_number }}

    - name: Prepare Pages Directory
      if: vars.PUBLISH_PUBLIC_DASHBOARD == 'true'
      run: |
        mkdir -p _site
        cp dashboard.html _site/index.html

    - name: Setup Pages
      if: vars.PUBLISH_PUBLIC_DASHBOARD == 'true'
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      if: vars.PUBLISH_PUBLIC_DASHBOARD == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: Deploy to GitHub Pages
      if: vars.PUBLISH_PUBLIC_DASHBOARD == 'true'
      id: deployment
      uses: actions/deploy-pages@v4
