name: Daily NAV & Technical Alerts Scheduler

on:
  schedule:
    # 5:00 AM UTC translates precisely to 10:30 AM IST
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows triggering the run manually from the GitHub Actions tab

jobs:
  run-scheduler:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Reconstruct Secure Config Files
      env:
        GCP_CRED_BASE64: ${{ secrets.GCP_CREDENTIALS_JSON }}
        GCP_TOKEN_BASE64: ${{ secrets.GCP_TOKEN_JSON }}
        ALERTS_YAML_CONTENT: ${{ secrets.ALERTS_YAML }}
      run: |
        mkdir -p config data
        echo "$GCP_CRED_BASE64" | base64 -d > config/credentials.json
        echo "$GCP_TOKEN_BASE64" | base64 -d > data/token.json
        echo "$ALERTS_YAML_CONTENT" > config/alerts.yaml

    - name: Run Daily NAV Tracker
      env:
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        python main.py
