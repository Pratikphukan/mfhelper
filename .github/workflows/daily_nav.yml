name: Daily NAV & Technical Alerts Scheduler

on:
  schedule:
    # 5:00 AM UTC translates precisely to 10:30 AM IST.
    # Runs Tuesday through Saturday because AMFI publishes business-day (Mon-Fri) NAVs late evening.
    - cron: '0 5 * * TUE-SAT'
  workflow_dispatch: # Allows triggering the run manually from the GitHub Actions tab

jobs:
  run-scheduler:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Reconstruct Secure Config Files
      env:
        GCP_CRED_BASE64: ${{ secrets.GCP_CREDENTIALS_JSON }}
        GCP_TOKEN_BASE64: ${{ secrets.GCP_TOKEN_JSON }}
        ALERTS_YAML_BASE64: ${{ secrets.ALERTS_YAML }}
      run: |
        mkdir -p config data
        echo "$GCP_CRED_BASE64" | base64 -d > config/credentials.json
        echo "$GCP_TOKEN_BASE64" | base64 -d > data/token.json
        echo "$ALERTS_YAML_BASE64" | base64 -d > config/alerts.yaml

    - name: Run Daily NAV Tracker
      env:
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        python main.py

    - name: Commit and Push state changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/last_nav.json data/sheet_columns.json || true
        git commit -m "chore: auto-update daily NAV state files [skip ci]" || true
        git push origin main || true
