name: Daily NAV & Technical Alerts Scheduler

on:
  schedule:
    # 5:00 AM UTC translates precisely to 10:30 AM IST.
    # Runs Tuesday through Saturday because AMFI publishes business-day (Mon-Fri) NAVs late evening.
    - cron: '0 5 * * TUE-SAT'
  workflow_dispatch: # Allows triggering the run manually from the GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Restore Daily NAV State Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          data/last_nav.json
          data/sheet_columns.json
          data/combined_portfolio_allocation.json
        key: daily-nav-state-${{ github.run_id }}-${{ github.run_number }}
        restore-keys: |
          daily-nav-state-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Reconstruct Secure Config Files
      env:
        GCP_CRED_BASE64: ${{ secrets.GCP_CREDENTIALS_JSON }}
        GCP_TOKEN_BASE64: ${{ secrets.GCP_TOKEN_JSON }}
        ALERTS_YAML_BASE64: ${{ secrets.ALERTS_YAML }}
      run: |
        mkdir -p config data
        echo "$GCP_CRED_BASE64" | base64 -d > config/credentials.json
        echo "$GCP_TOKEN_BASE64" | base64 -d > data/token.json
        echo "$ALERTS_YAML_BASE64" | base64 -d > config/alerts.yaml

    - name: Run Daily NAV Tracker
      env:
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        python main.py

    - name: Run Performance Returns Analyzer
      run: |
        python returns_main.py --no-benchmark

    - name: Run Consolidated Portfolio Map
      run: |
        python portfolio_map_main.py

    - name: Compile Web Dashboard
      run: |
        python dashboard_main.py

    - name: Save Daily NAV State Cache
      uses: actions/cache/save@v4
      with:
        path: |
          data/last_nav.json
          data/sheet_columns.json
          data/combined_portfolio_allocation.json
        key: daily-nav-state-${{ github.run_id }}-${{ github.run_number }}

    - name: Copy dashboard to server index
      run: cp dashboard.html index.html

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
